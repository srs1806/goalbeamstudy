    <script>
      (function() {
        try {
          var search = window.location.search;
          if (search && search.indexOf('p=') !== -1) {
            var params = new URLSearchParams(search);
            var routePath = params.get('p');
            if (routePath) {
              var extraQ = params.get('q2');
              var baseDir = window.location.pathname.replace(/index\.html$/, '').replace(/\/+$/, '');
              var cleanSub = routePath.replace(/^\/+/, '');
              var nextUrl = (baseDir ? baseDir + '/' : '/') + cleanSub + (extraQ ? '?' + extraQ : '') + window.location.hash;
              window.history.replaceState(null, '', nextUrl);
            }
          }
        } catch (_) {}

        function isWsError(err) {
          if (!err) return false;
          var msg = typeof err === 'string' ? err : (err.message || (err.reason && err.reason.message) || err.toString() || '');
          return msg.indexOf('WebSocket') !== -1 || msg.indexOf('websocket') !== -1 || msg.indexOf('closed without opened') !== -1;
        }
        window.addEventListener('unhandledrejection', function(e) {
          if (isWsError(e.reason)) {
            e.preventDefault();
            e.stopImmediatePropagation();
          }
        }, true);
        window.addEventListener('error', function(e) {
          if (isWsError(e.message) || isWsError(e.error)) {
            e.preventDefault();
            e.stopImmediatePropagation();
            return;
          }
          // Self-heal if a cached index.html points to old hashed JS/CSS files after a publish
          var target = e.target;
          if (target && (target.tagName === 'SCRIPT' || target.tagName === 'LINK')) {
            var src = target.src || target.href || '';
            if (src.indexOf('/src/main.tsx') !== -1 && /\.github\.io$/i.test(window.location.hostname || '')) {
              window.__goalbeamUnbuiltSource = true;
              return;
            }
            if (src.indexOf('assets/') !== -1 || src.indexOf('/src/main.tsx') !== -1) {
              try {
                if (!sessionStorage.getItem('goalbeam_boot_retry')) {
                  sessionStorage.setItem('goalbeam_boot_retry', '1');
                  if ('caches' in window) {
                    caches.keys().then(function(keys) {
                      return Promise.all(keys.map(function(k) { return caches.delete(k); }));
                    }).finally(function() {
                      window.location.reload();
                    });
                  } else {
                    window.location.reload();
                  }
                }
              } catch (_) {}
            }
          }
        }, true);
      })();

    <script>
      (function() {
        window.__goalbeamHardRecover = function() {
          var jobs = [];
          if ('caches' in window) {
            jobs.push(caches.keys().then(function(keys) {
              return Promise.all(keys.map(function(k) { return caches.delete(k); }));
            }));
          }
          if ('serviceWorker' in navigator) {
            jobs.push(navigator.serviceWorker.getRegistrations().then(function(regs) {
              return Promise.all(regs.map(function(r) { return r.unregister(); }));
            }));
          }
          Promise.all(jobs).catch(function(){}).finally(function() {
            window.location.reload();
          });
        };
        setTimeout(function() {
          if (window.__goalbeamAppMounted) return;
          if (window.__goalbeamUnbuiltSource) {
            var ghStatus = document.getElementById('goalbeam-boot-status');
            if (ghStatus) {
              ghStatus.style.display = 'block';
              ghStatus.textContent = 'GitHub Pages is serving unbuilt source files. Enable Settings -> Pages -> Source: GitHub Actions to deploy the built app.';
            }
            return;
          }
          try {
            if (!sessionStorage.getItem('goalbeam_boot_retry')) {
              sessionStorage.setItem('goalbeam_boot_retry', '1');
              window.__goalbeamHardRecover();
              return;
            }
          } catch (_) {}
          var status = document.getElementById('goalbeam-boot-status');
          var btn = document.getElementById('goalbeam-boot-retry-btn');
          if (status) {
            status.style.display = 'block';
            status.textContent = 'Connection was interrupted while loading. Tap below to refresh.';
          }
          if (btn) btn.style.display = 'inline-block';
        }, 7000);
      })();
    </script>
