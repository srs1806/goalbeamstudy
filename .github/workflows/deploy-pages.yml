name: Deploy Goalbeam to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --no-audit --no-fund
          fi

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build production bundle for GitHub Pages
        env:
          RAW_PAGES_BASE: ${{ steps.pages.outputs.base_path }}
        run: |
          if [ -z "$RAW_PAGES_BASE" ] || [ "$RAW_PAGES_BASE" = "/" ]; then
            export VITE_PUBLIC_BASE="/"
          else
            export VITE_PUBLIC_BASE="${RAW_PAGES_BASE%/}/"
          fi
          npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
